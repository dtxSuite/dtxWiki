name: Release checks

# Run on demand before tagging, or as the required checks for release.yml.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  postgres-migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtxwiki_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dtxwiki_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DTXWIKI_POSTGRES_MIGRATION_TEST_DATABASE_URL: >-
        postgresql+pg8000://postgres:postgres@127.0.0.1:5432/dtxwiki_migration
      DTXWIKI_POSTGRES_TEST_DATABASE_URL: >-
        postgresql+pg8000://postgres:postgres@127.0.0.1:5432/dtxwiki_test
      # The join concurrency suite creates and drops its own tables, so it gets
      # a separate database: the migration suite asserts its database starts
      # empty, and sharing one would couple the two by execution order.
      DTXWIKI_POSTGRES_CONCURRENCY_TEST_DATABASE_URL: >-
        postgresql+pg8000://postgres:postgres@127.0.0.1:5432/dtxwiki_concurrency
      DTXWIKI_REQUIRE_POSTGRES_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Create isolated PostgreSQL test databases
        run: |
          .venv/bin/python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+pg8000://postgres:postgres@127.0.0.1:5432/postgres"
          )
          with engine.connect().execution_options(
              isolation_level="AUTOCOMMIT"
          ) as connection:
              for database in ("dtxwiki_test", "dtxwiki_concurrency"):
                  connection.execute(text(f"DROP DATABASE IF EXISTS {database}"))
                  connection.execute(text(f"CREATE DATABASE {database}"))
          PY
      - name: Execute PostgreSQL runtime suites through xdist loadgroup
        # Selection by marker covers every shared-database case and proves the
        # postgres group stays on one worker. Configured URLs turn missing or
        # unreachable databases into failures instead of collection skips.
        run: >-
          .venv/bin/python -m pytest backend/tests -q -n 4 --dist loadgroup
          -m "xdist_group and not release_migration" --tb=short
      - name: Execute SQLite and PostgreSQL migration regressions
        # This selects every migration case once, including SQLite cases
        # without a postgres group. Shared PostgreSQL storage stays on one worker.
        run: VENV=.venv make test-migrations
      # PR CI deselects the capacity guards (`make test-backend` runs
      # -m "not release_scale and not release_migration"). The steps above
      # already run PostgreSQL and migration guards; this one runs the rest.
      - name: Execute the release-scale backend guards
        run: >-
          .venv/bin/python -m pytest backend/tests -q -n 4 --dist loadgroup
          -m "release_scale and not xdist_group and not release_migration" --tb=short

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # The release-gate validator tests start node (the gate script's i18n
      # coverage check), so pin it rather than inherit the runner's.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Run packaging and acceptance tests with log capture
        run: |
          mkdir -p .ci-evidence
          set +e
          .venv/bin/python -m pytest tests/packaging -v --tb=short \
            2>&1 | tee .ci-evidence/packaging.log
          packaging_rc=${PIPESTATUS[0]}
          .venv/bin/python -m pytest tests/acceptance -v --tb=short \
            2>&1 | tee .ci-evidence/acceptance.log
          acceptance_rc=${PIPESTATUS[0]}
          exit $((packaging_rc | acceptance_rc))
      - name: Run release-gate validator tests
        run: VENV=.venv make test-release-gate
      - name: Redact captured logs
        if: always() && hashFiles('.ci-evidence/*.log') != ''
        run: |
          for f in .ci-evidence/*.log; do
            bash scripts/redact_evidence.sh < "$f" > "${f%.log}.redacted.log" || true
          done
      - name: Upload evidence artifacts
        if: always() && hashFiles('.ci-evidence/*.redacted.log') != ''
        uses: actions/upload-artifact@v6
        with:
          name: evidence-${{ github.run_id }}
          path: .ci-evidence/*.redacted.log
          retention-days: 90

  # `npm ci` and the SPA build run inside the image, so only a real build sees
  # a COPY that no longer lists a script the generator imports, a file missing
  # from the context, a changed base image or a failing install. The packaging
  # test of the COPY list cannot see those.
  docker-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the frontend stage of the image
        run: docker build --target frontend -f Dockerfile .

  # Graph browser gates run for release qualification, outside ordinary CI.
  graph-2k:
    name: Graph (2K)
    # Playwright 1.59 cannot install browser dependencies on ubuntu-26.04,
    # which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Local Graph WebGL shaders
        run: npm run test:graph-webgl -- --project=chromium
      - name: Run the real-API 2K graph e2e
        id: playwright
        # The isolated wrapper and the 2K specs share this switch. Without it
        # the acceptance silently skips despite a green release-check job.
        env:
          DTXWIKI_E2E_GRAPH_2K: "1"
        run: >-
          npm run test:e2e -- tests/e2e/workspace_graph_2k_real.spec.ts
          tests/e2e/workspace_graph_reading_real.spec.ts
          tests/e2e/workspace_graph_first_view.spec.ts
          --project=chromium
      # The HTML report inlines step titles, traces and attachments; scrub it
      # exactly as the `e2e` job does before it is published.
      - name: Redact the Playwright report before publishing it
        if: always()
        run: |
          if [ -d playwright-report ]; then
            bash scripts/redact_evidence.sh --dir playwright-report
          fi
      - name: Upload Playwright report
        if: always() && (steps.playwright.outcome == 'success' || hashFiles('playwright-report/index.html') != '')
        uses: actions/upload-artifact@v6
        with:
          name: e2e-graph-2k-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 14

  graph-10k:
    # Playwright 1.59 cannot install browser dependencies on ubuntu-26.04,
    # which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact-scale benchmark guards
        run: node --test scripts/bench/graph/render_contract.test.mjs
      # The WebGL gate's @pc10k cases; graph-2k runs the rest of the gate.
      - name: Verify PC 10K native WebGL cases
        run: npm run test:graph-webgl -- --project=chromium-pc10k --forbid-only
      - name: Verify PC 10K and mobile 2K capacity
        id: playwright
        env:
          DTXWIKI_E2E_GRAPH_10K: "1"
          DTXWIKI_E2E_GRAPH_10K_DENSE: "1"
          DTXWIKI_E2E_GRAPH_10K_AGGREGATED: "1"
        # --forbid-only: a committed test.only would otherwise run alone and
        # leave the lane green with the other cases never run.
        run: >-
          npm run test:e2e -- tests/e2e/workspace_graph_10k_real.spec.ts
          tests/e2e/workspace_graph_10k_motion.spec.ts
          tests/e2e/workspace_graph_10k_aggregated.spec.ts
          --project=chromium --workers=1 --retries=0 --forbid-only
          --reporter=line,html
      - name: Redact the 10K report before publishing it
        if: always()
        run: |
          if [ -d playwright-report ]; then
            bash scripts/redact_evidence.sh --dir playwright-report
          fi
      - name: Upload PC 10K functional evidence
        if: always() && (steps.playwright.outcome == 'success' || hashFiles('playwright-report/index.html') != '')
        uses: actions/upload-artifact@v6
        with:
          name: graph-10k-functional-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
