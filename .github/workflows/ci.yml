name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Superseded PR commits can stop; every main push keeps its own group,
  # including pending runs that a shared branch group would otherwise replace.
  # A re-run joins its PR's group too, so re-running an older commit's run
  # cancels the run for the PR head. Re-run the latest run instead.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The MIT-licensed gitleaks CLI, not gitleaks-action: the action needs a
      # GITLEAKS_LICENSE secret on an organization repository and exits 1
      # without one. The image is pinned by digest as well as by tag, so a
      # re-pushed tag cannot change what runs here. `git` mode with no
      # --log-opts scans `git log --all`, i.e. every ref the full-depth
      # checkout fetched; --redact keeps any finding's value out of the log.
      - name: Scan the full history with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --verbose /repo

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # tests/static runs node (the i18n coverage gate always; the e2e helper
      # self-runners when node_modules is present, which it is not here), so
      # the job pins the same node as every other job instead of taking
      # whatever the runner image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Check release versions and README references
        run: make check-version
      - name: Lint backend and tests
        run: .venv/bin/ruff check backend tests scripts
      # Dedicated SQLite/PostgreSQL migration regressions run in Release checks.
      - name: Run backend functional and static tests
        run: |
          VENV=.venv make test-backend
          VENV=.venv make test-static

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          # Pinned, not the floating major. The shared frontend validation
          # target runs helpers importing tests/e2e/*.ts, which require
          # unflagged TypeScript type stripping from Node 22.18. This job
          # installs the frontend dependencies the backend job does not have.
          node-version: "22.18.0"
          cache: npm
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Install frontend dependencies
        run: npm ci
      # Include the shared UI/CSS contracts from tests/static in the same gate
      # developers run locally, alongside schemas, types, lint, unit/desktop
      # tests and E2E helper self-runners. Browser E2E remains a separate job.
      - name: Run frontend validation gate
        run: VENV=.venv make check-frontend

  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Match package-lock.json. Browsers and OS dependencies are preinstalled,
    # avoiding the per-job apt downloads that stalled on the Ubuntu mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      # Actions mounts /github/home as UID 1001; Firefox requires its owner
      # to match the browser's execution user.
      options: --user 1001 --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # Together the legs must name every project in playwright.config.ts.
      # A renamed or removed project fails here (`--project` rejects unknown
      # names), but a project added to the config runs in no PR leg; only the
      # weekly exhaustive run, which passes no --project, reaches it.
      matrix:
        include:
          - name: chromium
            projects: --project=chromium
          - name: firefox-webkit
            projects: --project=firefox --project=webkit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install Python dependencies
        run: |
          uv sync --locked --extra dev
          # The browser image need not supply a system Python for redaction.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: npm ci
      # Standard profile: every spec on Chromium, @cross-browser specs on all
      # three. Each matrix job owns its database, backend and background worker.
      # The whole suite meets all three engines weekly, in
      # .github/workflows/e2e-browsers.yml. The real-API 2K specs skip here
      # without DTXWIKI_E2E_GRAPH_2K; Release checks runs them.
      - name: Run Playwright e2e
        id: playwright
        run: npm run test:e2e -- ${{ matrix.projects }}
      # The suite drives `/reset-password?token=<one-time token>`, and the HTML
      # reporter base64-inlines every step title into index.html on EVERY run,
      # green ones included -- so the upload below publishes the token for 14
      # days even when nothing fails and tracing is off. `--dir` decodes that
      # payload, plus the trace zips and the text attachments under data/, and
      # redacts them in place. It cannot reach a screenshot; it names what it
      # skipped in the job log.
      #
      # Deliberately NOT `|| true` (unlike release-checks.yml's `packaging` per-file
      # pipe): the only non-zero exit is the break-glass hard-fail on a
      # production secret env name or a PEM private key, and by then the bytes
      # have already been scrubbed in place. Existing reports still upload
      # after a failure. A successful run must produce a report; setup/build
      # failures before Playwright starts have no report to upload.
      - name: Redact the Playwright report before publishing it
        if: always()
        run: |
          if [ -d playwright-report ]; then
            bash scripts/redact_evidence.sh --dir playwright-report
          fi
      - name: Upload Playwright report
        if: always() && (steps.playwright.outcome == 'success' || hashFiles('playwright-report/index.html') != '')
        uses: actions/upload-artifact@v6
        with:
          name: e2e-standard-${{ github.run_id }}-${{ matrix.name }}
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
